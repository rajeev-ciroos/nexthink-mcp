[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexthink-mcp"
version = "0.1.0"
description = "Read-only MCP server for Nexthink (digital employee experience): devices, applications, crashes and experience summaries via NQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexthink-mcp = "nexthink_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexthink_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
